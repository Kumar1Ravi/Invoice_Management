<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duplicate Analysis - Invoice Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="analysis.css">
</head>
<body>

<div class="main-container">
    <div class="tab-content active">
        <div class="tab-header">
            <h2><i class="fas fa-search-plus"></i> Duplicate Analysis Results</h2>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="runDuplicateCheck()">
                    <i class="fas fa-play"></i> Execute Duplicate Check
                </button>                                     
                <button class="btn btn-danger" onclick="clearDuplicateValidation()">
                    <i class="fas fa-eraser"></i> Clear Duplicate Validation
                </button>
                <button class="btn btn-danger" onclick="clearAllUserStatus()">
                    <i class="fas fa-eraser"></i> Clear All User Status
                </button>
            </div>
        </div>

        <div id="loadingState" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading duplicate analysis data...</p>
        </div>

        <div class="table-wrapper" id="tableWrapper" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>SNo</th>
                        <th>SAP ID</th>
                        <th>GIS ID</th>
                        <th>Employee Name</th>
                        <th>Source Country</th>
                        <th>Destination Country</th>
                        <th>SP Fee</th>
                        <th>SP Tax</th>
                        <th>Gov Fee</th>
                        <th>VFS Fee</th>
                        <th>Misc Exp</th>
                        <th>Tax</th>
                        <th>Total Amount</th>
                        <th>Duplicate Status</th>
                        <th>Source</th>
                        <th>User Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Notification -->
<div id="notification">
    <span class="close-btn" onclick="hideNotification()">&times;</span>
    <div id="notificationMessage">Operation completed successfully.</div>
    <div style="font-size: 12px; margin-top: 4px; opacity: 0.8;">
        <span id="notification-time"></span>
    </div>
</div>

<script src="analysis.js"></script>
</body>
</html>
